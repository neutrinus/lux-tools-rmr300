# ESPHome configuration for the SNK robot mower display board (ESP32).
# See docs/install.md. Needs a secrets.yaml with wifi_ssid, wifi_password,
# api_key, ap_password and mower_pin.

substitutions:
  name: mower
  friendly_name: Mower

external_components:
  # To test a branch, change @main to @<branch>.
  - source: github://neutrinus/lux-tools-rmr300@main:components
    components: [snk_mower]
    refresh: 1h

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  baud_rate: 0  # UART0 pins are not used by the mower link, but keep the console quiet
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback Hotspot
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

time:
  - platform: sntp
    id: mower_time
    # Dim the display from 20:00 to 06:00.
    on_time:
      - seconds: 0
        minutes: 0
        hours: 20
        then:
          - switch.turn_on: display_night
      - seconds: 0
        minutes: 0
        hours: 6
        then:
          - switch.turn_off: display_night
    # After boot, once the clock is known, pick the mode for the current hour.
    on_time_sync:
      - if:
          condition:
            lambda: 'return !id(night_mode_initialized);'
          then:
            - lambda: |-
                id(night_mode_initialized) = true;
                int h = id(mower_time).now().hour;
                if (h >= 20 || h < 6)
                  id(display_night).turn_on();
                else
                  id(display_night).turn_off();

globals:
  - id: night_mode_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

# Link to the main board (U13), connector J8.
uart:
  id: mower_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 230400
  rx_buffer_size: 512

snk_mower:
  id: my_mower
  uart_id: mower_uart
  pin: !secret mower_pin  # the 4-digit PIN set on the mower
  display_clk: 33
  display_mosi: 25
  display_cs: 32
  buzzer_pin: 27
  rain_pin: 36  # electrodes driven from GPIO18/GPIO5

  # Main entities
  mower_state:
    name: "State"  # idle, mowing, trimming, returning, charging, docked, error, locked
  battery_level:
    name: "Battery"
  error_code:
    name: "Error Code"  # 0 = no error
  raining:
    name: "Raining"

  # Diagnostics, disabled in Home Assistant by default
  cut_area:
    name: "Cut Area"
    disabled_by_default: true
  work_area:
    name: "Work Area"
    disabled_by_default: true
  total_minutes:
    name: "Total Minutes"
    disabled_by_default: true
  on_minutes:
    name: "On Minutes"
    disabled_by_default: true
  bat_health:
    name: "Battery Health"
    disabled_by_default: true
  rain_delay:
    name: "Rain Delay"
    disabled_by_default: true
  rain_adc:
    name: "Rain Sensor ADC"
    disabled_by_default: true
  light_level:
    name: "Light Level"
    disabled_by_default: true
  device_name:
    name: "Device Name"
    disabled_by_default: true
  model:
    name: "Model"
    disabled_by_default: true
  serial:
    name: "Serial"
    disabled_by_default: true
  firmware_version:
    name: "Mainboard Firmware"
    disabled_by_default: true
  battery_name:
    name: "Battery Type"
    disabled_by_default: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

# Front buttons on the display board, active low. START or HOME, then OK
# within 3 s, like the original firmware. Not exposed to Home Assistant.
binary_sensor:
  - platform: gpio
    id: key_start
    internal: true
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_start();'
  - platform: gpio
    id: key_home
    internal: true
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_home();'
  - platform: gpio
    id: key_ok
    internal: true
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_ok();'

button:
  - platform: template
    name: "Start Mowing"
    icon: "mdi:play"
    on_press:
      - lambda: 'id(my_mower).start_mowing();'
  - platform: template
    name: "Return to Dock"
    icon: "mdi:home-import-outline"
    on_press:
      - lambda: 'id(my_mower).return_to_dock();'
  - platform: template
    name: "Stop"
    icon: "mdi:stop"
    on_press:
      - lambda: 'id(my_mower).stop_mowing();'
  - platform: template
    name: "Trim Edge"  # only from the station
    icon: "mdi:vector-square"
    on_press:
      - lambda: 'id(my_mower).trim_edge();'

# Dims the display (display_night_brightness, default 20 %). Driven by the
# time schedule above, not exposed to Home Assistant.
switch:
  - platform: template
    id: display_night
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(my_mower).set_display_night(true);'
    turn_off_action:
      - lambda: 'id(my_mower).set_display_night(false);'
