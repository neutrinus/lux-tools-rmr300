substitutions:
  name: kosiarka
  friendly_name: Kosiarka

external_components:
  # Built on another machine, so the component comes from GitHub.
  # To test a branch before merging, change @main to @<branch>.
  - source: github://neutrinus/lux-tools-rmr300@main:components
    components: [snk_mower]
    refresh: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  baud_rate: 0
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback Hotspot
    password: "Hxye5fmx2yDo"

captive_portal:

time:
  - platform: sntp
    id: mower_time

api:
  encryption:
    key: "NDgm+gGpAoan2fh1f71mGv9lMga8nOynabbt8gF3JRM="

ota:
  - platform: esphome

uart:
  id: mower_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 230400
  rx_buffer_size: 512

snk_mower:
  id: my_mower
  uart_id: mower_uart
  pin: "9633"
  display_clk: 33
  display_mosi: 25
  display_cs: 32
  buzzer_pin: 27
  # Rain sensor: electrodes driven from GPIO18/GPIO5, read on ADC GPIO36.
  rain_pin: 36

  battery_level:
    name: "${friendly_name} Battery Level"
  error_code:
    name: "${friendly_name} Error Code"
  light_level:
    name: "${friendly_name} Light Level"
  work_area:
    name: "${friendly_name} Work Area"
  cut_area:
    name: "${friendly_name} Cut Area"
  total_minutes:
    name: "${friendly_name} Total Minutes"
  on_minutes:
    name: "${friendly_name} On Minutes"
  bat_health:
    name: "${friendly_name} Battery Health"
  bat_level_bars:
    name: "${friendly_name} Battery Bars"
  rain_delay:
    name: "${friendly_name} Rain Delay"
  rain_adc:
    name: "${friendly_name} Rain Sensor ADC"

  is_mowing:
    name: "${friendly_name} Is Mowing"
  is_charging:
    name: "${friendly_name} Is Charging"
  is_docked:
    name: "${friendly_name} Is Docked"
  has_error:
    name: "${friendly_name} Has Error"
  is_locked:
    name: "${friendly_name} Is Locked"
  is_returning:
    name: "${friendly_name} Is Returning"
  raining:
    name: "${friendly_name} Raining"

  device_name:
    name: "${friendly_name} Device Name"
  model:
    name: "${friendly_name} Model"
  serial:
    name: "${friendly_name} Serial"
  firmware_version:
    name: "${friendly_name} Firmware Version"
  battery_name:
    name: "${friendly_name} Battery Name"
  mower_state:
    name: "${friendly_name} Mower State"

# WiFi RSSI of the display board. The mower drives around the garden, so this
# gives a rough idea of where it is.
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 30s

# Front-panel buttons on the display board (from the original firmware, see
# 20261009_claude_investigation.md): active low, need the internal pull-up.
# START then OK = start mowing, HOME then OK = return to station (3 s window),
# the same key commands the original firmware sends to the mainboard.
# ON (K4) is not wired to the ESP32.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} START Button"
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_start();'
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} HOME Button"
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_home();'
  - platform: gpio
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} OK Button"
    filters:
      - delayed_on_off: 50ms
    on_press:
      - lambda: 'id(my_mower).key_ok();'


button:
  - platform: template
    name: "${friendly_name} Start Mowing"
    icon: "mdi:play"
    on_press:
      - lambda: 'id(my_mower).start_mowing();'
  - platform: template
    name: "${friendly_name} Return to Dock"
    icon: "mdi:home-import-outline"
    on_press:
      - lambda: 'id(my_mower).return_to_dock();'
  - platform: template
    name: "${friendly_name} Stop"
    icon: "mdi:stop"
    on_press:
      - lambda: 'id(my_mower).stop_mowing();'
  - platform: template
    name: "${friendly_name} Trim Edge"
    icon: "mdi:vector-square"
    on_press:
      - lambda: 'id(my_mower).trim_edge();'


  # Logs the frames recorded since boot (the API log connects too late to see them).
  - platform: template
    name: "${friendly_name} Dump Boot Trace"
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(my_mower).dump_trace();'

  # === Send Raw JSON button (reads from text field below) ===
  - platform: template
    name: "${friendly_name} Send Raw JSON"
    icon: "mdi:send"
    on_press:
      - lambda: 'id(my_mower).send_raw_json(id(raw_json_buf));'

globals:
  - id: raw_json_buf
    type: std::string
    restore_value: no
    initial_value: ''

text:
  - platform: template
    name: "${friendly_name} Raw JSON"
    icon: "mdi:code-json"
    mode: text
    optimistic: true
    initial_value: '{"cmd":1090519050,"action":1}'
    on_value:
      - lambda: |
          id(raw_json_buf) = x;
          ESP_LOGI("ha", "Raw JSON buffer updated: %s", x.c_str());
